<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Entry')}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>

<main class="container narrow">
  <h2 th:text="${pageTitle}">New entry</h2>
  <form class="card" th:action="${action}" th:object="${form}" method="post">
    <label>Date
      <input type="date" th:field="*{entryDate}" required>
      <small class="err" th:if="${#fields.hasErrors('entryDate')}" th:errors="*{entryDate}"></small>
    </label>
    <label>Title
      <input type="text" th:field="*{title}" maxlength="150" required>
      <small class="err" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
    </label>
    <label>Category
      <select th:field="*{category}">
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
      </select>
    </label>
    <label>Mood (1 = bad, 5 = great)
      <select th:field="*{mood}">
        <option th:each="m : ${#numbers.sequence(1, 5)}" th:value="${m}" th:text="${m}"></option>
      </select>
      <small class="err" th:if="${#fields.hasErrors('mood')}" th:errors="*{mood}"></small>
    </label>
    <label>Notes
      <textarea th:field="*{content}" rows="10" maxlength="10000"></textarea>
      <small class="err" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></small>
    </label>
    <div class="actions">
      <button class="btn" type="submit">Save</button>
      <a class="btn ghost" th:href="@{/entries}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
