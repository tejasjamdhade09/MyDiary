<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script th:src="@{/js/app.js}" defer></script>
  <title th:text="${title} + ' - Daily Diary'">Daily Diary</title>
</head>
<body>
<header class="topbar" th:fragment="topbar">
  <a class="brand" th:href="@{/entries}">📓 Daily Diary</a>
  <div class="topbar-actions">
    <button id="installBtn" class="btn small" type="button" hidden>Install app</button>
    <form th:action="@{/logout}" method="post">
      <button class="btn small ghost" type="submit">Log out</button>
    </form>
  </div>
</header>
</body>
</html>
