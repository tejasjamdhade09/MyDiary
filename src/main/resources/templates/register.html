<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body class="center">
<main class="card auth">
  <h1>Create account</h1>
  <form th:action="@{/register}" th:object="${form}" method="post">
    <label>Username
      <input type="text" th:field="*{username}" autocomplete="username" required>
      <small class="err" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
    </label>
    <label>Password (min 8 characters)
      <input type="password" th:field="*{password}" autocomplete="new-password" required>
      <small class="err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
    </label>
    <label>Confirm password
      <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
      <small class="err" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
    </label>
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already registered? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
