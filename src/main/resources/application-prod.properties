# ---------------------------------------------------------------
# Production profile (PostgreSQL on Render)
#
# Option A - set these 3 environment variables on Render:
#     DB_URL       = jdbc:postgresql://HOST:5432/DBNAME
#     DB_USER      = your database user
#     DB_PASSWORD  = your database password
#
# Option B - set HOST/PORT/NAME instead (render.yaml does this for you):
#     DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD also work and override these.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small pool for the free database plan
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true

# Host puts the app behind an HTTPS proxy
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
